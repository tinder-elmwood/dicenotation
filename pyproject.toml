[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicenotation"
version = "0.1.0"
description = "Parse and roll tabletop dice notation like 3d6+2 or 4d6kh3."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "tinder-elmwood" }]

[tool.setuptools.packages.find]
include = ["dicenotation*"]
